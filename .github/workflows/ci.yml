name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile hooks
        run: python3 -m py_compile hooks/*.py
      - name: Run hook test suite
        run: python3 tests/test_hooks.py
